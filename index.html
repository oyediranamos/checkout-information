<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="checkout-container">
    <h2>Checkout</h2>
    <form action="#" method="POST">
      
      <!-- Personal Details -->
      <fieldset>
        <legend>Personal Information</legend>
        
        <div class="form-group">
          <label for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            autocomplete="name" 
            required 
            placeholder="Oyediran Amos"
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            autocomplete="email" 
            required 
            placeholder="amos@example.com"
          >
        </div>
      </fieldset>

      <!-- Shipping Address -->
      <fieldset>
        <legend>Shipping Address</legend>

        <div class="form-group">
          <label for="address">Street Address</label>
          <input 
            type="text" 
            id="address" 
            name="address" 
            autocomplete="street-address" 
            required 
            placeholder="123 Main St"
          >
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input 
            type="text" 
            id="city" 
            name="city" 
            autocomplete="address-level2" 
            required 
            placeholder="New York"
          >
        </div>

        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" name="country" autocomplete="country" required>
            <option value="">-- Select Country --</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="UK">United Kingdom</option>
            <option value="NG">Nigeria</option>
            <option value="AU">Australia</option>
            <option value="JPN">Japan</option>
            <option value="SPN">Spain</option>
          </select>
        </div>
      </fieldset>

      <!-- Payment Information -->
      <fieldset>
        <legend>Payment Details</legend>

        <div class="form-group">
          <label for="card">Card Number</label>
          <input 
            type="text" 
            id="card" 
            name="card" 
            autocomplete="cc-number" 
            required 
            pattern="\d{16}" 
            maxlength="16"
            title="Card number must be exactly 16 digits" 
            placeholder="1234567890123456"
          >
        </div>

        <div class="form-group inline-group">
          <div>
            <label for="exp-month">Expiry Month</label>
            <input 
              type="number" 
              id="exp-month" 
              name="exp-month" 
              autocomplete="cc-exp-month" 
              min="1" 
              max="12" 
              required 
              placeholder="MM"
            >
          </div>

          <div>
            <label for="exp-year">Expiry Year</label>
            <input 
              type="number" 
              id="exp-year" 
              name="exp-year" 
              autocomplete="cc-exp-year" 
              min="2026" 
              max="2035" 
              required 
              placeholder="YYYY"
            >
          </div>
        </div>
      </fieldset>

      <!-- Terms & Submission -->
      <div class="form-group checkbox-group">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
      </div>

      <button type="submit" class="submit-btn">Complete Purchase</button>

    </form>
  </main>

</body>
</html>
